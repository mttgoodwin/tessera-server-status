# Server status: a tile that shows whether your servers and services are up, how long, and their uptime %.
# It reads Home Assistant entities only (Uptime Kuma, or Ping): no fetch, no network permission.
# Every name, label and hint is a key into translations/<language>.json, part "app".
id: server_status
version: 0.3.0
api: "0.15"             # options of kind `entity` need 0.15
icon: lan-connect
maintainer: mttgoodwin
license: MIT
stage: beta
topics: [tech, home]
requires:
  esphome: 2026.6.2
boards: any
flash_kb: 4

tiles:
  - id: servers
    name: tile_name
    icon: lan-connect
    sizes: { min: 1x1, max: 2x2 }
    memory: 3400
    example: tile_example
    options:
      # Server 1..4: a status entity (Uptime Kuma's Status sensor: up, down, pending, maintenance; or a Ping
      # binary_sensor: on, off), an optional sensor with how long it is up (a start time, or a duration), and an
      # optional uptime percentage (Uptime Kuma).
      - { id: status1, kind: entity, domains: [sensor, binary_sensor], label: status1, hint: status_hint }
      - { id: info1, kind: entity, domains: [sensor], attributes: [unit_of_measurement], label: info1, hint: info_hint }
      - { id: uptime1, kind: entity, domains: [sensor], label: uptime1, hint: uptime_hint }
      - { id: status2, kind: entity, domains: [sensor, binary_sensor], label: status2, hint: status_hint }
      - { id: info2, kind: entity, domains: [sensor], attributes: [unit_of_measurement], label: info2, hint: info_hint }
      - { id: uptime2, kind: entity, domains: [sensor], label: uptime2, hint: uptime_hint }
      - { id: status3, kind: entity, domains: [sensor, binary_sensor], label: status3, hint: status_hint }
      - { id: info3, kind: entity, domains: [sensor], attributes: [unit_of_measurement], label: info3, hint: info_hint }
      - { id: uptime3, kind: entity, domains: [sensor], label: uptime3, hint: uptime_hint }
      - { id: status4, kind: entity, domains: [sensor, binary_sensor], label: status4, hint: status_hint }
      - { id: info4, kind: entity, domains: [sensor], attributes: [unit_of_measurement], label: info4, hint: info_hint }
      - { id: uptime4, kind: entity, domains: [sensor], label: uptime4, hint: uptime_hint }

# What a tap on the tile opens: every server with its state, its detail and since when.
cards:
  - { id: servers, name: card_name }

# In the top bar, while a server is down: its name in red (only for servers on a tile of this screen).
bar_items:
  - { id: outage, label: bar_label, icon: close-network-outline, example: bar_example }
